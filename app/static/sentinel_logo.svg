<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D4ED8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -0.5px;
      fill: #0F172A;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 0.3px;
      fill: #64748B;
    }
    @media (prefers-color-scheme: dark) {
      .title-text { fill: #F8FAFC; }
      .subtitle-text { fill: #94A3B8; }
    }
  </style>

  <!-- Fintech Shield Emblem -->
  <g transform="translate(6, 8)" filter="url(#shadow)">
    <!-- Outer Shield -->
    <path d="M26 3 L6 10 V27 C6 43 14.5 54 26 59 C37.5 54 46 43 46 27 V10 L26 3 Z" fill="url(#shieldGrad)" />
    <!-- Inner Right Bevel -->
    <path d="M26 3 V59 C37.5 54 46 43 46 27 V10 L26 3 Z" fill="#1E40AF" opacity="0.45" />
    <!-- Radar Pulse / Checkmark -->
    <path d="M17 30 L23 36 L35 22" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="64" y="36" class="title-text">SentinelFraud AI</text>
  <text x="64" y="56" class="subtitle-text">Real-Time Credit Card Fraud Risk Engine</text>
</svg>
